name: ToDoList CI/CD

on:
  push:
    branches:
      - main

jobs:

  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push API
        run: |
          docker build \
            -f ToDoList/src/ToDoList.Api/Dockerfile \
            -t erkinbee/todolist-api:latest \
            ToDoList

          docker push erkinbee/todolist-api:latest

      - name: Build and push Blazor
        run: |
          docker build \
            -f ToDoList/src/ToDoList.BlazorUI/Dockerfile \
            -t erkinbee/todolist-blazor:latest \
            ToDoList

          docker push erkinbee/todolist-blazor:latest

  deploy:
    name: Deploy to Ubuntu Server
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}

          script: |
            cd /root/todolist

            docker compose pull

            docker compose up -d

            docker image prune -f